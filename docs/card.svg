<svg xmlns="http://www.w3.org/2000/svg" width="696" height="556" viewBox="0 0 696 556" role="img" aria-label="npx huryasar terminal card">
  <defs>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2c38"/>
      <stop offset="1" stop-color="#22242e"/>
    </linearGradient>
  </defs>

  <rect width="696" height="556" rx="12" fill="#15161d"/>
  <rect width="696" height="34" rx="12" fill="url(#chrome)"/>
  <rect y="22" width="696" height="12" fill="url(#chrome)"/>
  <line x1="0" y1="34" x2="696" y2="34" stroke="#31333f"/>

  <circle cx="18" cy="17" r="5" fill="#ff5f57"/>
  <circle cx="36" cy="17" r="5" fill="#febc2e"/>
  <circle cx="54" cy="17" r="5" fill="#28c840"/>

  <text x="348" y="21" fill="#8b8ea3" font-size="11"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">terminal</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
    <text x="20" y="64" xml:space="preserve"><tspan fill="#7bd88f">$</tspan><tspan fill="#d8dae4"> npx huryasar</tspan></text>
    <text x="20" y="93" xml:space="preserve"><tspan fill="rgb(255, 95, 175)">=-..:::==+-=+==#*=-:+@*###+=</tspan><tspan fill="#d8dae4">  </tspan><tspan fill="#d8dae4" opacity="0.55">╭</tspan><tspan fill="#d8dae4" opacity="0.55">───────────────────────────────────────────────────</tspan><tspan fill="#d8dae4" opacity="0.55">╮</tspan></text>
    <text x="20" y="112" xml:space="preserve"><tspan fill="rgb(249, 97, 178)">--:---:.:*-===%@#+-:=*#***==</tspan><tspan fill="#d8dae4">  </tspan><tspan fill="#d8dae4" opacity="0.55">│</tspan><tspan fill="#d8dae4"> </tspan><tspan fill="rgb(255, 95, 175)" font-weight="700">Atalay</tspan><tspan fill="#d8dae4"> </tspan><tspan fill="rgb(255, 95, 175)" font-weight="700">Hüryaşar</tspan><tspan fill="#d8dae4">  </tspan><tspan fill="#d8dae4" opacity="0.55">@atalayhuryasar</tspan><tspan fill="#d8dae4">                   </tspan><tspan fill="#d8dae4" opacity="0.55">│</tspan></text>
    <text x="20" y="131" xml:space="preserve"><tspan fill="rgb(243, 98, 182)">-::+=:-..++-+-%@**-:==*++#==</tspan><tspan fill="#d8dae4">  </tspan><tspan fill="#d8dae4" opacity="0.55">│</tspan><tspan fill="#d8dae4"> </tspan><tspan fill="rgb(120, 130, 255)" font-weight="700">Creative</tspan><tspan fill="#d8dae4"> </tspan><tspan fill="rgb(120, 130, 255)" font-weight="700">Technologist</tspan><tspan fill="#d8dae4">  </tspan><tspan fill="#6cb6ff">·</tspan><tspan fill="#d8dae4">  </tspan><tspan fill="#6cb6ff">Somewhere</tspan><tspan fill="#d8dae4"> </tspan><tspan fill="#6cb6ff">in</tspan><tspan fill="#d8dae4"> </tspan><tspan fill="#6cb6ff">Asia</tspan><tspan fill="#d8dae4">        </tspan><tspan fill="#d8dae4" opacity="0.55">│</tspan></text>
    <text x="20" y="150" xml:space="preserve"><tspan fill="rgb(237, 100, 185)">=:-:::--.+===-****--==**=#*=</tspan><tspan fill="#d8dae4">  </tspan><tspan fill="#d8dae4" opacity="0.55">│</tspan><tspan fill="#d8dae4">                                                    </tspan><tspan fill="#d8dae4" opacity="0.55">│</tspan></text>
    <text x="20" y="169" xml:space="preserve"><tspan fill="rgb(232, 101, 189)">-:-.=:--:++#+=*=++=-==##+++=</tspan><tspan fill="#d8dae4">  </tspan><tspan fill="#d8dae4" opacity="0.55">│</tspan><tspan fill="#d8dae4"> Hello, this is </tspan><tspan fill="rgb(255, 95, 175)" font-weight="700">Atalay</tspan><tspan fill="#d8dae4"> </tspan><tspan fill="rgb(255, 95, 175)" font-weight="700">Hüryaşar</tspan><tspan fill="#d8dae4">, a </tspan><tspan fill="#f78fd6" font-weight="700">Creative</tspan><tspan fill="#d8dae4">         </tspan><tspan fill="#d8dae4" opacity="0.55">│</tspan></text>
    <text x="20" y="188" xml:space="preserve"><tspan fill="rgb(226, 103, 192)">:--:=:.::=*==*#*+==-==#*+==-</tspan><tspan fill="#d8dae4">  </tspan><tspan fill="#d8dae4" opacity="0.55">│</tspan><tspan fill="#d8dae4"> </tspan><tspan fill="#f78fd6" font-weight="700">Technologist</tspan><tspan fill="#d8dae4">.                                      </tspan><tspan fill="#d8dae4" opacity="0.55">│</tspan></text>
    <text x="20" y="207" xml:space="preserve"><tspan fill="rgb(220, 104, 196)">-.::.:::.=+=-:..:=*=++#*+=--</tspan><tspan fill="#d8dae4">  </tspan><tspan fill="#d8dae4" opacity="0.55">│</tspan><tspan fill="#d8dae4">                                                    </tspan><tspan fill="#d8dae4" opacity="0.55">│</tspan></text>
    <text x="20" y="226" xml:space="preserve"><tspan fill="rgb(214, 106, 199)">::::-----+-       .+**#+==--</tspan><tspan fill="#d8dae4">  </tspan><tspan fill="#d8dae4" opacity="0.55">│</tspan><tspan fill="#d8dae4"> I build small, sharp tools for people who live in  </tspan><tspan fill="#d8dae4" opacity="0.55">│</tspan></text>
    <text x="20" y="245" xml:space="preserve"><tspan fill="rgb(208, 107, 203)">---++---=.         .*#*=----</tspan><tspan fill="#d8dae4">  </tspan><tspan fill="#d8dae4" opacity="0.55">│</tspan><tspan fill="#d8dae4"> a terminal and a menu bar at the same time:        </tspan><tspan fill="#d8dae4" opacity="0.55">│</tspan></text>
    <text x="20" y="264" xml:space="preserve"><tspan fill="rgb(202, 109, 206)">=-:=#=:-.           :%#-----</tspan><tspan fill="#d8dae4">  </tspan><tspan fill="#d8dae4" opacity="0.55">│</tspan><tspan fill="#d8dae4"> </tspan><tspan fill="rgb(255, 95, 175)" font-weight="700">Homebrew</tspan><tspan fill="#d8dae4"> </tspan><tspan fill="rgb(255, 95, 175)" font-weight="700">taps</tspan><tspan fill="#d8dae4">, </tspan><tspan fill="rgb(255, 95, 175)" font-weight="700">macOS</tspan><tspan fill="#d8dae4"> </tspan><tspan fill="rgb(255, 95, 175)" font-weight="700">utilities</tspan><tspan fill="#d8dae4">, </tspan><tspan fill="rgb(255, 95, 175)" font-weight="700">GitHub</tspan><tspan fill="#d8dae4"> </tspan><tspan fill="rgb(255, 95, 175)" font-weight="700">Actions</tspan><tspan fill="#d8dae4">,    </tspan><tspan fill="#d8dae4" opacity="0.55">│</tspan></text>
    <text x="20" y="283" xml:space="preserve"><tspan fill="rgb(196, 110, 210)">-.:----.             =#=::--</tspan><tspan fill="#d8dae4">  </tspan><tspan fill="#d8dae4" opacity="0.55">│</tspan><tspan fill="#d8dae4"> and the occasional </tspan><tspan fill="rgb(255, 95, 175)" font-weight="700">Go</tspan><tspan fill="#d8dae4"> program.                     </tspan><tspan fill="#d8dae4" opacity="0.55">│</tspan></text>
    <text x="20" y="302" xml:space="preserve"><tspan fill="rgb(190, 112, 213)">-.--.:-              :#-=--:</tspan><tspan fill="#d8dae4">  </tspan><tspan fill="#d8dae4" opacity="0.55">│</tspan><tspan fill="#d8dae4">                                                    </tspan><tspan fill="#d8dae4" opacity="0.55">│</tspan></text>
    <text x="20" y="321" xml:space="preserve"><tspan fill="rgb(185, 113, 217)">::-:.:                =##-:-</tspan><tspan fill="#d8dae4">  </tspan><tspan fill="#d8dae4" opacity="0.55">│</tspan><tspan fill="#d8dae4"> I believe the best software installs with one line </tspan><tspan fill="#d8dae4" opacity="0.55">│</tspan></text>
    <text x="20" y="340" xml:space="preserve"><tspan fill="rgb(179, 115, 220)">::-*.:                -=+-:-</tspan><tspan fill="#d8dae4">  </tspan><tspan fill="#d8dae4" opacity="0.55">│</tspan><tspan fill="#d8dae4"> and then gets out of the way. I am currently       </tspan><tspan fill="#d8dae4" opacity="0.55">│</tspan></text>
    <text x="20" y="359" xml:space="preserve"><tspan fill="rgb(173, 116, 224)">::--..                :-:::.</tspan><tspan fill="#d8dae4">  </tspan><tspan fill="#d8dae4" opacity="0.55">│</tspan><tspan fill="#d8dae4"> shipping </tspan><tspan fill="#5fd7f2" text-decoration="underline">open</tspan><tspan fill="#d8dae4"> </tspan><tspan fill="#5fd7f2" text-decoration="underline">source</tspan><tspan fill="#d8dae4"> </tspan><tspan fill="#5fd7f2" text-decoration="underline">macOS</tspan><tspan fill="#d8dae4"> </tspan><tspan fill="#5fd7f2" text-decoration="underline">tools</tspan><tspan fill="#d8dae4"> and writing about </tspan><tspan fill="#d8dae4" opacity="0.55">│</tspan></text>
    <text x="20" y="378" xml:space="preserve"><tspan fill="rgb(167, 118, 227)">..:...                -::::.</tspan><tspan fill="#d8dae4">  </tspan><tspan fill="#d8dae4" opacity="0.55">│</tspan><tspan fill="#d8dae4"> the parts that bite.                               </tspan><tspan fill="#d8dae4" opacity="0.55">│</tspan></text>
    <text x="20" y="397" xml:space="preserve"><tspan fill="rgb(161, 119, 231)">......       ...      :::...</tspan><tspan fill="#d8dae4">  </tspan><tspan fill="#d8dae4" opacity="0.55">│</tspan><tspan fill="#d8dae4">                                                    </tspan><tspan fill="#d8dae4" opacity="0.55">│</tspan></text>
    <text x="20" y="416" xml:space="preserve"><tspan fill="rgb(155, 121, 234)">:::::.      ..:..     --.:-.</tspan><tspan fill="#d8dae4">  </tspan><tspan fill="#d8dae4" opacity="0.55">│</tspan><tspan fill="#d8dae4"> </tspan><tspan fill="#d8dae4" opacity="0.55">Say</tspan><tspan fill="#d8dae4"> </tspan><tspan fill="#d8dae4" opacity="0.55">hi,</tspan><tspan fill="#d8dae4"> </tspan><tspan fill="#d8dae4" opacity="0.55">I</tspan><tspan fill="#d8dae4"> </tspan><tspan fill="#d8dae4" opacity="0.55">do</tspan><tspan fill="#d8dae4"> </tspan><tspan fill="#d8dae4" opacity="0.55">not</tspan><tspan fill="#d8dae4"> </tspan><tspan fill="#d8dae4" opacity="0.55">bite.</tspan><tspan fill="#d8dae4">                             </tspan><tspan fill="#d8dae4" opacity="0.55">│</tspan></text>
    <text x="20" y="435" xml:space="preserve"><tspan fill="rgb(149, 122, 238)">::-:-.    .:--==-:    +--=-.</tspan><tspan fill="#d8dae4">  </tspan><tspan fill="#d8dae4" opacity="0.55">╰</tspan><tspan fill="#d8dae4" opacity="0.55">───────────────────────────────────────────────────</tspan><tspan fill="#d8dae4" opacity="0.55">╯</tspan></text>
    <text x="20" y="454" xml:space="preserve"><tspan fill="rgb(143, 124, 241)">::=:..    .-=+**+=:   #+-=-.</tspan><tspan fill="#d8dae4">  </tspan></text>
    <text x="20" y="473" xml:space="preserve"><tspan fill="rgb(138, 125, 245)">.:-...   .:=*####+=.  -:=+*.</tspan><tspan fill="#d8dae4">  </tspan></text>
    <text x="20" y="492" xml:space="preserve"><tspan fill="rgb(132, 127, 248)">:::...   :=*#@@@%#+:  -:=+=.</tspan><tspan fill="#d8dae4">  </tspan></text>
    <text x="20" y="511" xml:space="preserve"><tspan fill="#d8dae4"> </tspan><tspan fill="rgb(126, 128, 252)">--::..   -+#@@@@@%#= .-.--.</tspan><tspan fill="#d8dae4">  </tspan></text>
    <text x="20" y="530" xml:space="preserve"><tspan fill="rgb(120, 130, 255)">=--:::. .=*@@@@@@@@+::-:::..</tspan><tspan fill="#d8dae4">  </tspan></text>
  </g>
</svg>
