    <text x="20" y="207" xml:space="preserve"><tspan fill="rgb(255, 95, 175)">│</tspan><tspan fill="#d8dae4">     Hello, this is </tspan><tspan fill="rgb(255, 95, 175)" font-weight="700">Atalay</tspan><tspan fill="#d8dae4"> </tspan><tspan fill="rgb(255, 95, 175)" font-weight="700">Hüryaşar</tspan><tspan fill="#d8dae4">, a </tspan><tspan fill="#f78fd6" font-weight="700">Creative</tspan><tspan fill="#d8dae4"> </tspan><tspan fill="#f78fd6" font-weight="700">Technologist</tspan><tspan fill="#d8dae4">.       </tspan><tspan fill="rgb(255, 95, 175)">│</tspan></text>
    <text x="20" y="226" xml:space="preserve"><tspan fill="rgb(255, 95, 175)">│</tspan><tspan fill="#d8dae4">                                                                    </tspan><tspan fill="rgb(255, 95, 175)">│</tspan></text>
    <text x="20" y="245" xml:space="preserve"><tspan fill="rgb(255, 95, 175)">│</tspan><tspan fill="#d8dae4">     I build small, sharp tools for people who live in a            </tspan><tspan fill="rgb(255, 95, 175)">│</tspan></text>
    <text x="20" y="264" xml:space="preserve"><tspan fill="rgb(255, 95, 175)">│</tspan><tspan fill="#d8dae4">     terminal and a menu bar at the same time: </tspan><tspan fill="rgb(255, 95, 175)" font-weight="700">Homebrew</tspan><tspan fill="#d8dae4"> </tspan><tspan fill="rgb(255, 95, 175)" font-weight="700">taps</tspan><tspan fill="#d8dae4">,       </tspan><tspan fill="rgb(255, 95, 175)">│</tspan></text>
    <text x="20" y="283" xml:space="preserve"><tspan fill="rgb(255, 95, 175)">│</tspan><tspan fill="#d8dae4">     </tspan><tspan fill="rgb(255, 95, 175)" font-weight="700">macOS</tspan><tspan fill="#d8dae4"> </tspan><tspan fill="rgb(255, 95, 175)" font-weight="700">utilities</tspan><tspan fill="#d8dae4">, </tspan><tspan fill="rgb(255, 95, 175)" font-weight="700">GitHub</tspan><tspan fill="#d8dae4"> </tspan><tspan fill="rgb(255, 95, 175)" font-weight="700">Actions</tspan><tspan fill="#d8dae4">, and the occasional </tspan><tspan fill="rgb(255, 95, 175)" font-weight="700">Go</tspan><tspan fill="#d8dae4">         </tspan><tspan fill="rgb(255, 95, 175)">│</tspan></text>
    <text x="20" y="302" xml:space="preserve"><tspan fill="rgb(255, 95, 175)">│</tspan><tspan fill="#d8dae4">     program.                                                       </tspan><tspan fill="rgb(255, 95, 175)">│</tspan></text>
    <text x="20" y="321" xml:space="preserve"><tspan fill="rgb(255, 95, 175)">│</tspan><tspan fill="#d8dae4">                                                                    </tspan><tspan fill="rgb(255, 95, 175)">│</tspan></text>
    <text x="20" y="340" xml:space="preserve"><tspan fill="rgb(255, 95, 175)">│</tspan><tspan fill="#d8dae4">     I believe the best software installs with one line and         </tspan><tspan fill="rgb(255, 95, 175)">│</tspan></text>
    <text x="20" y="359" xml:space="preserve"><tspan fill="rgb(255, 95, 175)">│</tspan><tspan fill="#d8dae4">     then gets out of the way. I am currently shipping </tspan><tspan fill="#5fd7f2" text-decoration="underline">open</tspan><tspan fill="#d8dae4">         </tspan><tspan fill="rgb(255, 95, 175)">│</tspan></text>
    <text x="20" y="378" xml:space="preserve"><tspan fill="rgb(255, 95, 175)">│</tspan><tspan fill="#d8dae4">     </tspan><tspan fill="#5fd7f2" text-decoration="underline">source</tspan><tspan fill="#d8dae4"> </tspan><tspan fill="#5fd7f2" text-decoration="underline">macOS</tspan><tspan fill="#d8dae4"> </tspan><tspan fill="#5fd7f2" text-decoration="underline">tools</tspan><tspan fill="#d8dae4"> and writing about the parts that bite.      </tspan><tspan fill="rgb(255, 95, 175)">│</tspan></text>
