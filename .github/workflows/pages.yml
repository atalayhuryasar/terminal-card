name: Deploy the web IDE

# The editor pulls in src/ and bin/ at runtime so the preview runs the real
# renderer and the download contains the real files. Publish all of it.

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'src/**'
      - 'bin/**'
      - 'LICENSE'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          # Turns Pages on if the repository has never had it enabled.
          enablement: true

      - name: Assemble the site
        run: |
          # Mirror the repository layout, so the editor's own relative imports
          # (web/app.js -> ../src/render.js) resolve exactly as they do in a
          # checkout.
          mkdir -p _site/web _site/bin
          cp -R web/. _site/web/
          cp -R src _site/src
          cp bin/card.js _site/bin/
          cp LICENSE _site/
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=./web/">
          <title>terminal-card</title>
          <p><a href="./web/">Open the terminal-card editor</a></p>
          HTML

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4