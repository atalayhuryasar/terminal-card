name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Check the CLI still runs
        run: node bin/card.js --links

      - name: Run tests
        run: npm test

      - name: Check the published file list is complete
        run: npm pack --dry-run

  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Card honours COLUMNS when piped
        run: |
          for w in 20 40 80 120; do
            COLUMNS=$w node bin/card.js --no-menu > "out-$w.txt"
          done

      # awk counts bytes, not columns: box-drawing characters are 3 bytes each,
      # so the overflow check has to measure display width in JavaScript.
      - name: No line overflows its terminal width
        run: node test/width-check.js

      - name: Card honours NO_COLOR
        run: |
          NO_COLOR=1 node bin/card.js --links > out.txt
          if grep -qP '\x1b' out.txt; then
            echo "escape codes leaked with NO_COLOR set"
            exit 1
          fi

      - name: Card is a valid JSON profile
        run: |
          node bin/card.js --json > profile.json
          node -e "const p=require('./profile.json'); if(!p.name||!p.menu?.length){console.error('incomplete profile'); process.exit(1)}; console.log('profile ok:', p.name)"