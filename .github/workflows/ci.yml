name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Check the CLI still runs
        run: node bin/card.js --links

      - name: Run tests
        run: npm test

      - name: Check the published file list is complete
        run: npm pack --dry-run

  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Card fits a narrow terminal
        run: node bin/card.js --no-menu | awk 'length > 60 { exit 1 }'

      - name: Card honours NO_COLOR
        run: |
          NO_COLOR=1 node bin/card.js --links | grep -q $'\x1b' && exit 1 || exit 0